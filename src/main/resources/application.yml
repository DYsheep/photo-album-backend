server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/photo_album?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      # 单文件/单请求上限，需与 file.max-size-mb 保持一致（应用内会再次校验）
      max-file-size: 100MB
      max-request-size: 110MB

  # 数据库迁移（Flyway）：结构变更纳入版本管理，启动时自动执行 db/migration 下未应用的脚本
  # 既有库首次接入：baseline-on-migrate 会把当前状态记为基线 V1，不重复执行 V1 的建表语句；
  # 差异部分请先用 sql/ 下的手工追平脚本补齐（见各脚本文件头说明）。
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    table: flyway_schema_history

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.photoalbum.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT 配置
jwt:
  # 安全要求：此处不得设置默认密钥（默认值会随公开仓库泄露，可被用于伪造管理员令牌）。
  # 生产环境必须通过环境变量 JWT_SECRET 注入不少于 32 个字符的随机值，例如：
  #   JWT_SECRET=$(head -c 48 /dev/urandom | base64)
  # 未注入时服务仍可启动，但每次启动会生成一次性随机密钥（重启后既有登录状态全部失效）。
  secret: ${JWT_SECRET:}
  expiration: 86400000    # 24小时（毫秒）
  header: Authorization

# 文件上传配置
file:
  upload-dir: C:/Develop/photo-data/uploads/
  access-url-prefix: /files/
  # 单文件大小上限（MB），可通过环境变量 FILE_MAX_SIZE_MB 覆盖。
  # 该值决定单次上传可占用的内存峰值（上传时整文件读入内存），不建议超过 100。
  max-size-mb: 100

# 腾讯云 COS
cos:
  secret-id: ${COS_SECRET_ID:}
  secret-key: ${COS_SECRET_KEY:}
  region: ap-hongkong
  bucket: photo-album-1306350779
  domain: https://photo-album-1306350779.cos.ap-hongkong.myqcloud.com
  # 私密照片对象 ACL：开启后私密照片对象为私有读（直链不可匿名访问），接口改为签发预签名地址
  # 若存储桶已关闭对象级 ACL 功能，可设为 false（届时仅预签名地址生效，直链仍可访问，需另行处理）
  private-acl-enabled: true
  # 私密照片预签名地址有效期（分钟）
  presigned-ttl-minutes: 60
  # 分享卡片封面预签名有效期（分钟）：社交平台会长期缓存卡片图，需要比页面级地址更长的有效期
  card-presigned-ttl-minutes: 10080

# 分享链接配置（生产环境通过环境变量 SHARE_BASE_URL 覆盖）
share:
  base-url: https://www.dyframe.art
  # 分享页服务端渲染所用模板（前端构建产物 index.html），后端会替换其中的卡片元数据块。
  # 留空则依次探测 ../frontend/dist/index.html 与 /opt/photo-album/frontend/dist/index.html；
  # 前端目录不在默认位置时用环境变量 SHARE_PAGE_TEMPLATE 指定绝对路径。
  page-template: ${SHARE_PAGE_TEMPLATE:}

# 应用安全相关配置
app:
  cors:
    # 允许跨域访问的来源白名单（逗号分隔），不使用通配符
    allowed-origins: https://www.dyframe.art,https://dyframe.art,http://localhost:5173,http://127.0.0.1:5173
  security:
    # 部署在 Nginx 反向代理之后时为 true：登录限流按 X-Forwarded-For 最右侧地址取值
    # （最左侧为客户可伪造字段）。服务直接对外暴露时请设为 false。
    trust-proxy: true

# 日志级别
logging:
  level:
    com.photoalbum.mapper: debug
